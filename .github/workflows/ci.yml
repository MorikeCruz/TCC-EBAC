
name: CI - TCC EBAC QE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BASE_URL: http://lojaebac.ebaconline.art.br

jobs:
  api:
    name: Testes de API (Supertest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Verificar presença dos Secrets
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: |
          if [ -n "$API_USER" ]; then
            echo "API_USER está configurado"
          else
            echo "::error::API_USER está vazio ou ausente"
            exit 1
          fi

          if [ -n "$API_PASS" ]; then
            echo "API_PASS está configurado"
          else
            echo "::error::API_PASS está vazio ou ausente"
            exit 1
          fi

      - name: Executar testes de API
        run: npm run api:test
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-api
          path: reports/api

  ui:
    name: Testes de UI (Cypress)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Executar testes de UI
        run: npm run ui:run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-ui
          path: reports/ui

  performance:
    name: Testes de performance (k6)
    runs-on: ubuntu-latest
    needs: [api, ui]

    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1

      - name: Criar pasta dos resultados
        run: mkdir -p Performance/results

      - name: k6 - login
        run: k6 run Performance/login.k6.js
        env:
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: Performance/results/login.html

      - name: k6 - catálogo
        run: k6 run Performance/catalogo.k6.js
        env:
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: Performance/results/catalogo.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-k6
          path: Performance/results

  mobile:
    name: Testes mobile (Android - execução manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar dependências mobile
        working-directory: Mobile
        run: npm install

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: cd Mobile && npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-mobile
          path: Mobile/allure-results
